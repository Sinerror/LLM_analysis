name: own-llm-vs-api
# Один сервер vLLM. Вариант задаётся переменными (их выставляет scripts/serve.py):
#   MODEL, MAX_LEN, GPU_UTIL, EXTRA
services:
  vllm:
    image: vllm/vllm-openai:v0.33.0
    container_name: vllm
    ipc: host
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - hf-cache:/root/.cache/huggingface
      - models:/models
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=0
    command: >
      --model ${MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --served-model-name local
      --max-model-len ${MAX_LEN:-16384}
      --gpu-memory-utilization ${GPU_UTIL:-0.90}
      --enable-prefix-caching
      --enable-auto-tool-choice --tool-call-parser hermes
      ${EXTRA:-}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    environment:
      - OLLAMA_NUM_PARALLEL=4        # по умолчанию 1: без этого бейзлайн проигрывал бы только из-за очереди
      - OLLAMA_CONTEXT_LENGTH=8192   # по умолчанию 4096 — длинные промпты DocCheck молча обрезались бы
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  hf-cache:
  models:
  ollama:
